name: cd
on: 
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download image tag artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tag
          path: .
      - name: Determine image tag used by CI
        id: resolve
        run: |
          PR_SHA=""
          
          if [ -f image-tag.txt ]; then
            PR_SHA=$(cat image-tag.txt)
          fi

          if [ -n "$PR_SHA" ]; then
            echo "tag=$PR_SHA" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Unable to determine image tag"
          exit 1
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Login and pull image from Gitlab
        env:
          IMAGE: "registry.gitlab.com/${{ vars.GITLAB_GROUP }}/${{ vars.GITLAB_PROJECT }}"
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << EOF
            set -e
            trap 'echo "Failed command: \$BASH_COMMAND at line \$LINENO"; exit 1' ERR

            login_gitlab() {
              echo "Logging in to GitLab Registry.."
              echo "${{ secrets.GITLAB_REGISTRY_PAT }}" | docker login registry.gitlab.com -u "${{ vars.GITLAB_USERNAME }}" --password-stdin
            }

            pull_image() {
              echo "Pulling new Docker image.."
              docker pull "${IMAGE}:${TAG}"
            }

            cleanup_old_images() {
              echo "Cleaning up old Docker images.."
              OLD_IMAGES=\$(docker images --format "{{.Repository}}:{{.Tag}} {{.ID}}" | grep "^${IMAGE}:" | grep -v ":${TAG}" | awk '{print $2}')
              
              if [ -n "\$OLD_IMAGES" ]; then
                docker rmi -f \$OLD_IMAGES || true
                echo "\$OLD_IMAGES removed"
              else
                echo "No old images to remove."
              fi
            }

            login_gitlab
            pull_image
            cleanup_old_images
          EOF
      - name: Deploy to VPS
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << EOF
            set -e
            trap 'echo "Failed command: \$BASH_COMMAND at line \$LINENO"; exit 1' ERR

            DEPLOY_DIR=/srv/derdiedas

            create_deploy_env() {
              echo "Updating .deploy.env file.."
              mkdir -p \$DEPLOY_DIR
              touch \$DEPLOY_DIR/.deploy.env
              sed -i '/^FE_SHA_TAG=/d' \$DEPLOY_DIR/.deploy.env
              echo "FE_SHA_TAG=${TAG}" >> \$DEPLOY_DIR/.deploy.env
            }
            
            update_containers() {
              echo "Updating containers.."
              cd \$DEPLOY_DIR || exit
              docker compose --env-file .deploy.env -p derdiedas up -d --remove-orphans
            }

            create_deploy_env
            update_containers
          EOF
