events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  limit_req_zone $binary_remote_addr zone=api:6m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=search:6m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=refresh:5m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=game:5m rate=60r/m;
  limit_req_status 429;

  server {
    listen 80;
    server_name derdiedas.my.id www.derdiedas.my.id;

    location /.well-known/acme-challenge/ {
      root /usr/share/nginx/html;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name derdiedas.my.id www.derdiedas.my.id;

    ssl_certificate /etc/letsencrypt/live/derdiedas.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/derdiedas.my.id/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
      try_files $uri /index.html;
    }

    location = /api/auth/refresh-token/ {
      proxy_pass http://backend:3000/auth/refresh-token/;
      limit_req zone=refresh burst=10 nodelay;
    }

    location = /api/game/token/ {
      proxy_pass http://backend:3000/game/token/;
      limit_req zone=game burst=10;
    }

    location = /api/game/start/ {
      proxy_pass http://backend:3000/game/start/;
      limit_req zone=game burst=10;
    }

    location ^~ /api/game/ {
      proxy_pass http://backend:3000/game/;
    }

    location = /api/search/ {
      proxy_pass http://backend:3000/search/;
      limit_req zone=search burst=20;
    }

    location /api/ {
      proxy_pass http://backend:3000/;
      limit_req zone=api burst=10 nodelay;
    }
  }
}
